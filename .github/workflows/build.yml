name: Build

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: false
    name: Build & Verify
    runs-on: ubuntu-latest
    env:
      # Signals build.gradle.kts to target a downloadable IntelliJ IDEA
      # Community (no local IDE install exists on the runner).
      CI: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build plugin
        run: ./gradlew buildPlugin

      # - name: Verify plugin
      #   run: ./gradlew verifyPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: easy-notes-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
