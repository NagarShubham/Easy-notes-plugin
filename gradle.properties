# The IntelliJ Platform provides its own bundled Kotlin stdlib at runtime,
# so we must not bundle a second copy with the plugin.
kotlin.stdlib.default.dependency = false

# Opt in to the new IntelliJ Platform artifact repositories layout.
org.jetbrains.intellij.platform.buildFeature.selfUpdateCheck = false

# Build performance
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
